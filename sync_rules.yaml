bucket_definitions:
  user_data:
    parameters: user_id
    data:
      - table: tasks
        where: user_id = ${user_id}
      - table: time_blocks
        where: user_id = ${user_id}
      - table: habit_logs
        where: user_id = ${user_id}
      - table: user_context
        where: user_id = ${user_id}
      - table: categories
        where: user_id = ${user_id}