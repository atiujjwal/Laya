# PowerSync Server Configuration

# Networking
port: 8080
host: 0.0.0.0

# Database Connection
database:
  uri: ${PS_DATABASE_URI}

sync_rules:
  path: /config/sync_rules.yaml

# Storage Configuration
storage:
  type: mongodb
  uri: mongodb://mongo:27017/powersync_buckets

# Security: Token Verification
jwt:
  public_key_path: /config/powersync-public.key
  algorithms: ["RS256"]