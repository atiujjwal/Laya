services:
  postgres:
    image: postgres:16
    container_name: laya_db
    environment:
      POSTGRES_USER: laya
      POSTGRES_PASSWORD: laya
      POSTGRES_DB: laya
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: