services:
  postgres:
    image: postgres:16
    container_name: laya_db
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: laya
      POSTGRES_PASSWORD: laya
      POSTGRES_DB: laya
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laya"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: laya_mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  powersync:
    image: journeyapps/powersync-service:latest
    container_name: laya_sync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      PS_DATABASE_URI: postgres://laya:laya@postgres:5432/laya
      PS_PORT: 8080
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
    volumes:
      - ./powersync.yaml:/config/powersync.yaml
      - ./sync_rules.yaml:/config/sync_rules.yaml
      - ./powersync-public.key:/config/powersync-public.key
      - ./powersync_data:/var/lib/powersync
    command: ["start", "-r", "unified"]

volumes:
  postgres_data:
  mongo_data:
  powersync_data: